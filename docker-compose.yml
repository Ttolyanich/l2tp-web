version: '3.8'

services:
  l2tp-web:
    image: ghcr.io/ttolyanich/l2tp-web:latest
    build: .
    container_name: l2tp-web
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    devices:
      - /dev/ppp:/dev/ppp
    volumes:
      - ./data:/app/data
      - /lib/modules:/lib/modules:ro
    env_file:
      - .env
    environment:
      - BIND_HOST=${BIND_HOST:-0.0.0.0}
      - BIND_PORT=${BIND_PORT:-5000}
      - PUBLIC_IP=${PUBLIC_IP:-}
      - NODE_NAME=${NODE_NAME:-L2TP-Gateway-1}
      - AUTH_MODE=${AUTH_MODE:-standalone}
