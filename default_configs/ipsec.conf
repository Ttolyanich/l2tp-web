# /etc/ipsec.conf - Libreswan IPsec configuration
config setup
    logfile=/var/log/pluto.log
    plutodebug=none
    keep-alive=20
    virtual_private=%v4:10.0.0.0/8,%v4:192.168.0.0/16,%v4:172.16.0.0/12,%v4:25.0.0.0/8,%v4:100.64.0.0/10,%v6:fd00::/8,%v6:fe80::/10

# Base connection MUST be declared before any connection that references it via also=
conn L2TP-PSK-noNAT
    authby=secret
    pfs=no
    auto=add
    keyingtries=3
    rekey=no
    ikelifetime=24h
    salifetime=24h
    type=transport
    left=%any
    leftprotoport=17/1701
    right=%any
    rightprotoport=17/%any

conn L2TP-PSK-NAT
    also=L2TP-PSK-noNAT
    rightsubnet=vhost:%priv
    nat-keepalive=yes
