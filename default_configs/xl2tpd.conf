[global]
ipsec saref = yes
debug tunnel = yes
listen-addr = 0.0.0.0

[lns default]
ip range = 10.18.12.2-10.18.12.255
assign ip = no
local ip = 10.18.12.1
refuse chap = yes
refuse pap = yes
require authentication = yes
ppp debug = yes
pppoptfile = /etc/ppp/options.xl2tpd
length bit = yes

[lac default]
redial = yes
redial timeout = 30
