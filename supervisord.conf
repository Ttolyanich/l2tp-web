[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisord.log
pidfile=/var/run/supervisord.pid

[program:pluto]
command=/bin/bash -c "rm -f /run/pluto/pluto.pid /run/pluto/pluto.ctl /var/run/pluto/pluto.pid /var/run/pluto/pluto.ctl; mkdir -p /run/pluto /var/lib/ipsec/nss; if [ -x /usr/libexec/ipsec/pluto ]; then exec /usr/libexec/ipsec/pluto --config /etc/ipsec.conf --nofork --stderrlog; else exec /usr/lib/ipsec/pluto --config /etc/ipsec.conf --nofork --stderrlog; fi"
autostart=true
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:xl2tpd]
command=/usr/sbin/xl2tpd -D
autostart=true
autorestart=true
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:l2tp_web]
directory=/app
command=/bin/bash -c "gunicorn -w 2 -b ${BIND_HOST:-0.0.0.0}:${BIND_PORT:-5000} app:app"
autostart=true
autorestart=true
priority=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
